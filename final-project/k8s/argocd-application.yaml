apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-final-inference
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/OF3000/mlops-hw.git
    targetRevision: final-project
    path: final-project/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
