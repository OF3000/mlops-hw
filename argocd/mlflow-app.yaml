apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: infra-tools
spec:
  project: default
  sources:
    - repoURL: 'https://community-charts.github.io/helm-charts'
      chart: mlflow
      targetRevision: 0.7.19
      helm:
        # Вказуємо шлях до файлу, який лежить у ДРУГОМУ джерелі
        valueFiles:
          - $values/values/mlflow-values.yaml

    # 2. Джерело ваших конфігів (Ваш Git-репозиторій)
    - repoURL: 'https://github.com/OF3000/goit-argo.git'
      targetRevision: main # Ваша гілка
      ref: values # Це псевдонім для цього репозиторію
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: application
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true