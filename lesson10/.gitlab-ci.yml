stages:
  - train

train-model:
  stage: train
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - aws --version
  script:
    - EXECUTION_NAME="pipeline-run-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - |
      PAYLOAD=$(cat <<EOF
      {
        "commit_sha": "${CI_COMMIT_SHA}",
        "branch": "${CI_COMMIT_REF_NAME}",
        "dataset_source": "s3://mlops-datasets/iris.csv",
        "triggered_by": "${GITLAB_USER_LOGIN}"
      }
      EOF
      )
    - echo "Starting Step Function execution ${EXECUTION_NAME}..."
    - >
      aws stepfunctions start-execution
      --state-machine-arn "${STATE_MACHINE_ARN}"
      --name "${EXECUTION_NAME}"
      --input "${PAYLOAD}"
  only:
    - main
    - merge_requests